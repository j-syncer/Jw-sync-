<script id="sh-theme-init">
(function(){
  var PK='jwsync_prefs_v1';
  var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
  var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
  function isDark(){return !document.body.classList.contains('light');}
  function getPrefs(){try{return JSON.parse(localStorage.getItem(PK)||'{}');}catch(e){return{};}}
  function saveTheme(dark){try{var p=getPrefs();p.isDarkMode=dark;localStorage.setItem(PK,JSON.stringify(p));}catch(e){}}
  function setIcon(btn,dark){btn.innerHTML=dark?MOON:SUN;btn.title=dark?'Switch to light mode':'Switch to dark mode';btn.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');}
  function initBtn(id){
    var btn=document.getElementById(id);
    if(!btn)return;
    setIcon(btn,isDark());
    btn.addEventListener('click',function(){
      var dark=isDark();
      document.body.classList.toggle('light',dark);
      saveTheme(!dark);
    });
    var mo=new MutationObserver(function(){setIcon(btn,isDark());});
    mo.observe(document.body,{attributes:true,attributeFilter:['class']});
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){initBtn('nav-theme-btn');});}
  else{initBtn('nav-theme-btn');}
})();
</script>

    /* highlight-aware import helpers (non-destructive: INSERT only) */
    var LOC_ID_COLS=['BookNumber','ChapterNumber','DocumentId','Track','IssueTagNumber','KeySymbol','MepsLanguage','Type'];
    function intval(v){ v=parseInt(v,10); return isFinite(v)?v:0; }

    function resolveLocationId(db, loc, present, create){
      var idCols=LOC_ID_COLS.filter(function(col){ return present.indexOf(col)>=0; });

      db.run('INSERT INTO Location ('+cols.map(function(col){return '"'+col+'"';}).join(',')+') VALUES ('+cols.map(function(){return '?';}).join(',')+')', vals);

      setMain('<div class="sh-state"><div class="sh-spin"></div><div>'+esc(t('loading'))+'</div></div>');
      var SQL, keepBuf;
      initSqlJs({locateFile:function(f){return SQLJS_CDN+f;}})
        .then(function(s){ SQL=s; return (file instanceof ArrayBuffer)?file:(file.arrayBuffer?file.arrayBuffer():new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsArrayBuffer(file);})); })
        .then(function(buf){ keepBuf=buf; return JSZip.loadAsync(buf); })
        .then(function(zip){ var k=Object.keys(zip.files).find(function(n){return /userdata\.db$/i.test(n);}); if(!k) throw new Error('no db'); return zip.file(k).async('uint8array'); })
        .then(function(bytes){
          var db=new SQL.Database(bytes);
          var ns=rows(db,"SELECT n.NoteId, n.Title, n.Content, n.LastModified, u.UserMarkId, u.ColorIndex, u.StyleIndex, l.Title AS LocTitle, l.BookNumber, l.ChapterNumber, l.DocumentId, l.Track, l.IssueTagNumber, l.KeySymbol, l.MepsLanguage, l.Type FROM Note n LEFT JOIN UserMark u ON n.UserMarkId=u.UserMarkId LEFT JOIN Location l ON n.LocationId=l.LocationId ORDER BY n.LastModified DESC");
          var tagMap={};
          rows(db,"SELECT tm.NoteId, tg.Name FROM TagMap tm JOIN Tag tg ON tm.TagId=tg.TagId WHERE tm.NoteId IS NOT NULL").forEach(function(r){ (tagMap[r.NoteId]=tagMap[r.NoteId]||[]).push(r.Name); });
          var brMap={};
          rows(db,"SELECT br.UserMarkId, br.BlockType, br.Identifier, br.StartToken, br.EndToken FROM BlockRange br").forEach(function(r){ (brMap[r.UserMarkId]=brMap[r.UserMarkId]||[]).push({blockType:r.BlockType,identifier:r.Identifier,startToken:r.StartToken,endToken:r.EndToken}); });
          ns.forEach(function(n){ n._tags=tagMap[n.NoteId]||[]; n._ranges=(n.UserMarkId!=null)?(brMap[n.UserMarkId]||[]):[]; });
          db.close();
          sendState={ notes:ns, sel:{}, fileName:(file&&file.name)||'backup.jwlibrary', tag:'' };
          // Persist into the shared session so Merge/Stats/Explorer can reuse it.
          try { if (window.JwSession && keepBuf) window.JwSession.put(keepBuf, sendState.fileName); } catch (_) {}
          renderSelect('');
        })
        .catch(function(e){ console.error(e); setMain('<div class="sh-state"><div class="sh-err">'+esc(t('error'))+'</div><button class="sh-btn sh-btn-ghost" id="sh-retry">'+esc(t('choose_backup'))+'</button></div>'); var rb=document.getElementById('sh-retry'); if(rb) rb.onclick=function(){ renderSendIntro(); }; });
    }

    var pendingAdopt=null;
    function runAdopt(db, notes, tagLabel, overlapMode){
      var label=tagLabel||t('shared_tag'); overlapMode=(overlapMode==='note')?'note':'layer';
      var now=new Date().toISOString().replace('T',' ').slice(0,19);
      var locPresent=tableCols(db,'Location'); var noteCols=tableCols(db,'Note');
      var hasUserMark=tableCols(db,'UserMark').length>0; var umCols=hasUserMark?tableCols(db,'UserMark'):[];
      var hasBlockRange=tableCols(db,'BlockRange').length>0;
      var added=0, highlights=0, imported=[];
      function tagId(name){ var s=String(name).replace(/'/g,"''"); var r=rows(db,"SELECT TagId FROM Tag WHERE Name='"+s+"' COLLATE NOCASE"); if(r.length) return r[0].TagId; db.run('INSERT INTO Tag (Name, Type) VALUES (?,1)',[name]); return rows(db,'SELECT last_insert_rowid() AS id')[0].id; }
      function nextTagPos(tid){ var r=rows(db,'SELECT COALESCE(MAX(Position),-1)+1 AS p FROM TagMap WHERE TagId='+(tid|0)); return r.length?r[0].p:0; }
      try{ db.run('PRAGMA foreign_keys=OFF;'); }catch(_){ }
      notes.forEach(function(nd){ try{
        var title=(typeof nd.title==='string')?nd.title:''; var content=sanitizeNoteHtml((typeof nd.content==='string')?nd.content:'');
        var hasHl = !!(noteHasHighlight(nd) && hasUserMark && hasBlockRange && locPresent.length);
        var locId=null, userMarkId=null, rngs=hasHl?normRanges(nd):[], mode='plain';
        if(hasHl){
          locId=resolveLocationId(db, nd.loc, locPresent, true);
          var overlaps = locId!==null && existingRanges(db, locId).some(function(e){ return rngs.some(function(r){ return rangesOverlap(r,e); }); });
          var makeLayer = (!overlaps) || (overlapMode==='layer'); mode=makeLayer?'layer':'note';
          if(makeLayer && locId!==null){
            var cc=['ColorIndex','LocationId','UserMarkGuid','Version'], vv=[intval(nd.color), locId, uuid(), 1];
            if(umCols.indexOf('StyleIndex')>=0){ cc.push('StyleIndex'); vv.push(intval(nd.style)); }
            db.run('INSERT INTO UserMark ('+cc.join(',')+') VALUES ('+cc.map(function(){return '?';}).join(',')+')', vv);
            userMarkId=lastId(db);
            rngs.forEach(function(r){ db.run('INSERT INTO BlockRange (BlockType, Identifier, StartToken, EndToken, UserMarkId) VALUES (?,?,?,?,?)',[r.blockType,r.identifier,r.startToken,r.endToken,userMarkId]); });
            highlights++;
          } else if(locId!==null){
            var er=db.exec('SELECT um.UserMarkId FROM UserMark um JOIN BlockRange br ON br.UserMarkId=um.UserMarkId WHERE um.LocationId='+(locId|0)+' LIMIT 1');
            if(er.length&&er[0].values.length) userMarkId=er[0].values[0][0];
          }
        }
        var anchor=(hasHl&&rngs[0])?rngs[0]:null;
        var nc=['Guid','Title','Content','LastModified','Created','BlockType','BlockIdentifier'];
        var nv=[uuid(),title,content,now,now,anchor?anchor.blockType:0,anchor?anchor.identifier:0];
        if(userMarkId!==null && noteCols.indexOf('UserMarkId')>=0){ nc.push('UserMarkId'); nv.push(userMarkId); }
        if(locId!==null && noteCols.indexOf('LocationId')>=0){ nc.push('LocationId'); nv.push(locId); }
        db.run('INSERT INTO Note ('+nc.join(',')+') VALUES ('+nc.map(function(){return '?';}).join(',')+')', nv);
        var noteId=lastId(db);
        var allTags=[label].concat(Array.isArray(nd.tags)?nd.tags:[]), seen={}, applied=[];
        allTags.forEach(function(tn){ tn=String(tn||'').trim(); if(!tn||seen[tn.toLowerCase()]) return; seen[tn.toLowerCase()]=1; var tid=tagId(tn); try{ db.run('INSERT INTO TagMap (TagId, NoteId, Position) VALUES (?,?,?)',[tid,noteId,nextTagPos(tid)]); applied.push(tn); }catch(_){ } });
        imported.push({ title:nd.title, content:nd.content, pub:notePub(nd), loc:nd.loc, color:nd.color, ranges:nd.ranges, tags:applied, mode:mode });
        added++;
      }catch(e){ console.error('adopt',e); } });
      return { added:added, highlights:highlights, imported:imported };
    }
    function finishAdopt(ctx, notes, tagLabel, overlapMode, file){
      setMain('<div class="sh-state"><div class="sh-spin"></div><div>'+esc(t('building'))+'</div></div>');
      var stats=null;
      return Promise.resolve().then(function(){
        stats=runAdopt(ctx.db, notes, tagLabel, overlapMode);
        var bytes=ctx.db.export(); ctx.db.close(); ctx.zip.file(ctx.dbKey, bytes);
        return ctx.zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}}).then(function(blob){ return { blob:blob, added:stats.added, name:(file&&file.name)||'backup.jwlibrary' }; });
      }).then(function(res){
        var base=(res.name||'backup').replace(/\.jwlibrary$/i,'');
        var imp=(stats&&stats.imported)||[], list='';
        for(var i=0;i<imp.length&&i<300;i++){ list+=noteRowHtml(imp[i]); }
        if(imp.length>300) list+='<div class="sh-more">'+esc(t('more_hint',{n:imp.length-300}))+'</div>';
        setMain('<div class="sh-panel"><p class="sh-ok">✓ '+esc(t('adopt_done',{n:res.added}))+'</p><p class="sh-section-help">'+esc(t('adopt_done_h'))+'</p>'+
          '<button class="sh-btn" id="sh-dlu">'+esc(t('download_updated'))+'</button>'+
          (list?('<h2 class="sh-section-title" style="margin-top:22px">'+esc(t('imp_title'))+'</h2><div class="sh-prevlist" style="margin-top:8px">'+list+'</div>'):'')+'</div>');
        document.getElementById('sh-dlu').onclick=function(){ var url=URL.createObjectURL(res.blob); var a=document.createElement('a'); a.href=url; a.download='updated_'+base+'.jwlibrary'; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){URL.revokeObjectURL(url);},3000); };
      }).catch(function(e){ console.error(e); setMain('<div class="sh-state"><div class="sh-err">'+esc(t('error'))+'</div><button class="sh-btn sh-btn-ghost" id="sh-rb">'+esc(t('back'))+'</button></div>'); var rb=document.getElementById('sh-rb'); if(rb) rb.onclick=renderReceive; });
    }

      setMain('<div class="sh-panel"><h2 class="sh-section-title">'+esc(t('ov_title'))+'</h2><p class="sh-section-help">'+esc(t('ov_q',{n:n}))+'</p>'+

    }
    function chooseAdopt(mode){ var pa=pendingAdopt; pendingAdopt=null; if(!pa) return; finishAdopt(pa.ctx, pa.notes, pa.tag, mode, pa.file); }
    function adoptIntoBackup(file, notes, tagLabel){
      tagLabel=tagLabel||t('shared_tag');
      setMain('<div class="sh-state"><div class="sh-spin"></div><div>'+esc(t('building'))+'</div></div>');
      var SQL;
      initSqlJs({locateFile:function(f){return SQLJS_CDN+f;}})
        .then(function(s){ SQL=s; return (file.arrayBuffer?file.arrayBuffer():new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsArrayBuffer(file);})); })
        .then(function(buf){ return JSZip.loadAsync(buf); })
        .then(function(zip){ var k=Object.keys(zip.files).find(function(n){return /userdata\.db$/i.test(n);}); if(!k) throw new Error('no db'); return zip.file(k).async('uint8array').then(function(bytes){ return { zip:zip, dbKey:k, db:new SQL.Database(bytes) }; }); })
        .then(function(ctx){
          var present=tableCols(ctx.db,'Location');
          var conflicts=findConflicts(ctx.db, notes, present);
          if(conflicts.length>0){ pendingAdopt={ ctx:ctx, notes:notes, tag:tagLabel, file:file }; renderOverlapChoice(conflicts); return; }
          return finishAdopt(ctx, notes, tagLabel, 'layer', file);
        })
        .catch(function(e){ console.error(e); setMain('<div class="sh-state"><div class="sh-err">'+esc(t('error'))+'</div><button class="sh-btn sh-btn-ghost" id="sh-rb">'+esc(t('back'))+'</button></div>'); var rb=document.getElementById('sh-rb'); if(rb) rb.onclick=renderReceive; });
    }

    /* ───── helpers ───── */
    function pickFile(accept,cb){ var fi=document.createElement('input'); fi.type='file'; fi.accept=accept; fi.style.display='none'; document.body.appendChild(fi); fi.onchange=function(){ var f=fi.files&&fi.files[0]; document.body.removeChild(fi); if(f) cb(f); }; fi.click(); }
    function readPending(){ return new Promise(function(resolve){ try{ var req=indexedDB.open(IDB_NAME,1); req.onupgradeneeded=function(e){ e.target.result.createObjectStore(IDB_STORE); }; req.onsuccess=function(e){ var db=e.target.result; var tx=db.transaction(IDB_STORE,'readwrite'); var g=tx.objectStore(IDB_STORE).get(IDB_KEY); g.onsuccess=function(){ var v=g.result; tx.objectStore(IDB_STORE).delete(IDB_KEY); db.close(); resolve(v||null); }; g.onerror=function(){ db.close(); resolve(null); }; }; req.onerror=function(){ resolve(null); }; }catch(_){ resolve(null); } }); }

    document.getElementById('sh-back').onclick=function(){ window.location.href='./'; };
    document.getElementById('sh-new').onclick=function(){
      // Privacy: forget the shared working file when the user starts over.
      try { if (window.JwSession) window.JwSession.clear(); } catch (_) {}
      renderHome();
    };

    document.title=t('title')+' — JW Sync';
    document.getElementById('sh-htitle').textContent=t('title');
    document.getElementById('sh-back').textContent=t('back');
    document.getElementById('sh-new').textContent=t('start_over');

    // Render the universal tool switcher into the header (no-op without the module).
    try { if (window.JwSession) window.JwSession.mountSwitcher(document.getElementById('sh-switch'), 'share'); } catch (_) {}

    document.addEventListener('DOMContentLoaded',function(){});
    // Prefer the persistent shared session (cross-tool), then the legacy
    // one-shot inbox (jwsync_share_v1) for backward compatibility.
    function shLegacyBoot(){ readPending().then(function(p){ if(p&&p.buffer){ renderSendIntro(p.buffer); } else { renderHome(); } }).catch(renderHome); }
    if(window.JwSession){
      window.JwSession.get().then(function(p){ if(p&&p.buffer){ renderSendIntro(p.buffer); } else { shLegacyBoot(); } }).catch(shLegacyBoot);
    } else {
      shLegacyBoot();
    }

    // test hooks
    window.__shRenderHome=renderHome;
    window.__shLoadBackup=loadBackup;
    window.__shRenderReceive=renderReceive;
    window.__shAdopt=adoptIntoBackup;
  })();
  </script>
</body>
